---
# Defaults for the PostgreSQL tier. Tuning values that depend on RAM/CPU are
# computed inside roles/postgresql from `instance_type` (surfaced by Terraform).
# Don't pin shared_buffers / effective_cache_size / max_connections here.

postgres_listen_address: "*"
postgres_port: 5432

# Where the storage role mounts the data disk. The PG data_dir lives under this.
postgres_mount_point: /var/lib/postgresql

# Filesystem to create on the data disk. ext4 is the safe default; xfs is fine
# too and slightly better for large WAL volumes.
postgres_data_disk_fs: ext4
