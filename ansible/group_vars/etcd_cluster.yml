---
# etcd defaults. The cluster topology comes from inventory (the etcd_cluster
# group) — these vars are for ports/scheme/data layout only.

etcd_client_port: 2379
etcd_peer_port:   2380
etcd_scheme:      http      # set to "https" when client certs are configured
etcd_data_dir:    /var/lib/etcd
etcd_initial_cluster_state: new    # roles/etcd will toggle to "existing" on add/remove
