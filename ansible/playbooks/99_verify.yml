---
# 99_verify — cheap, safe healthchecks. Run any time. Run after every change.

- name: Connectivity check
  hosts: all
  gather_facts: false
  tasks:
    - name: SSH and Python reachable
      ansible.builtin.ping:

- name: Storage mount check
  hosts: database_hosts
  gather_facts: false
  tasks:
    - name: Assert data disk is mounted
      ansible.builtin.command: "mountpoint -q {{ postgres_mount_point | default('/var/lib/postgresql') }}"
      changed_when: false
      when: data_disk_device is defined and data_disk_device | length > 0

- name: PostgreSQL install check
  hosts: database_hosts
  gather_facts: true
  vars:
    # This play carries no postgresql role, so recompute bin_dir from the same family
    # map the role uses. postgres_version comes from playbooks/group_vars/all.yml; an
    # inventory override of postgres_bin_dir still flows through (it outranks this).
    postgres_bin_dir: >-
      {{ '/usr/lib/postgresql/' ~ postgres_version ~ '/bin'
         if ansible_os_family == 'Debian'
         else '/usr/pgsql-' ~ postgres_version ~ '/bin' }}
  tasks:
    - name: Assert the PostgreSQL server binary is installed
      ansible.builtin.command: "{{ postgres_bin_dir }}/postgres --version"
      register: pg_server_version
      changed_when: false

    - name: Show installed PostgreSQL version
      ansible.builtin.debug:
        msg: "{{ pg_server_version.stdout }}"

- name: etcd cluster health
  hosts: etcd_cluster[0]
  gather_facts: false
  vars:
    # This play carries no etcd role, so fall back to the role's defaults. An override
    # in inventory/<cloud>/group_vars still flows through (it outranks these defaults).
    etcd_local_endpoint: "{{ etcd_scheme | default('http') }}://127.0.0.1:{{ etcd_client_port | default(2379) }}"
  environment:
    ETCDCTL_API: "3"
    # etcdctl lives in /usr/bin (package install) or /usr/local/bin (binary install).
    PATH: "/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: List etcd members
      ansible.builtin.command: "etcdctl --endpoints={{ etcd_local_endpoint }} -w json member list"
      register: etcd_members
      changed_when: false

    - name: Assert every inventory member joined the cluster
      ansible.builtin.assert:
        that:
          - (etcd_members.stdout | from_json).members | length == groups['etcd_cluster'] | length
        fail_msg: >-
          etcd reports {{ (etcd_members.stdout | from_json).members | length }} member(s)
          but inventory lists {{ groups['etcd_cluster'] | length }}.
        success_msg: "All {{ groups['etcd_cluster'] | length }} etcd members present."

    - name: Check health of every member (non-zero exit if any is unhealthy)
      ansible.builtin.command: "etcdctl --endpoints={{ etcd_local_endpoint }} endpoint health --cluster"
      register: etcd_cluster_health
      changed_when: false

    - name: Show cluster health
      ansible.builtin.debug:
        msg: "{{ etcd_cluster_health.stdout_lines + etcd_cluster_health.stderr_lines }}"

- name: Patroni cluster health
  hosts: database_hosts[0]
  gather_facts: false
  tasks:
    - name: Query the Patroni cluster state (REST API)
      ansible.builtin.uri:
        # This play carries no patroni role; fall back to the role default REST port.
        # An inventory override of patroni_restapi_port still flows through.
        url: "http://127.0.0.1:{{ patroni_restapi_port | default(8008) }}/cluster"
        return_content: true
      register: patroni_cluster
      changed_when: false

    - name: Assert exactly one leader and every database host is a member
      vars:
        members: "{{ (patroni_cluster.content | from_json).members }}"
      ansible.builtin.assert:
        that:
          - members | selectattr('role', 'equalto', 'leader') | list | length == 1
          - members | length == groups['database_hosts'] | length
        fail_msg: >-
          Patroni reports {{ members | length }} member(s) and
          {{ members | selectattr('role', 'equalto', 'leader') | list | length }} leader(s);
          expected {{ groups['database_hosts'] | length }} member(s) and exactly 1 leader.
        success_msg: >-
          Patroni: {{ members | length }} member(s), 1 leader
          ({{ members | selectattr('role', 'equalto', 'leader') | map(attribute='name') | first }}).

    - name: Show Patroni topology
      vars:
        members: "{{ (patroni_cluster.content | from_json).members }}"
      ansible.builtin.debug:
        msg: >-
          {{ members | map(attribute='name')
             | zip(members | map(attribute='role'), members | map(attribute='state'))
             | list }}
