# 99_verify — cheap, safe healthchecks. Run any time. Run after every change.

- name: Connectivity check
  hosts: all
  gather_facts: false
  tasks:
    - name: SSH and Python reachable
      ansible.builtin.ping:

- name: Cluster health (planned)
  hosts: database_hosts[0]
  gather_facts: false
  tasks:
