---
# common role defaults. Override per-cloud in inventory/<cloud>/group_vars/
# (inventory group_vars beat role defaults).

# Locale and timezone applied to every node.
timezone: UTC
locale: en_US.UTF-8

# Base packages every node needs before any service install. Mapped per OS family
# (a few names differ between Debian/Ubuntu and RHEL/Rocky).
common_base_packages_map:
  Debian: [chrony, curl, ca-certificates, gnupg, tar, acl]
  RedHat: [chrony, curl, ca-certificates, gnupg2, tar, acl]
common_base_packages: "{{ common_base_packages_map[ansible_os_family] }}"

# chrony's service name differs by family.
common_ntp_service: "{{ 'chrony' if ansible_os_family == 'Debian' else 'chronyd' }}"

# Kernel tuning applied to every host via /etc/sysctl.d/60-poaf.conf.
# These are PostgreSQL-oriented defaults; harmless for etcd-only nodes.
# Set a key to a different value (or remove it) to override.
common_sysctl:
  vm.swappiness: 1
  vm.overcommit_memory: 2
  vm.overcommit_ratio: 80
  vm.dirty_background_ratio: 3
  vm.dirty_ratio: 15
  net.core.somaxconn: 1024
  net.ipv4.tcp_max_syn_backlog: 4096

# pam_limits entries. Written to /etc/security/limits.d/60-poaf.conf. The postgres
# user need not exist yet — PAM applies these at login once it does.
common_limits:
  - { domain: postgres, limit_type: soft, limit_item: nofile, value: "65536" }
  - { domain: postgres, limit_type: hard, limit_item: nofile, value: "65536" }
  - { domain: postgres, limit_type: soft, limit_item: nproc,  value: "16384" }
  - { domain: postgres, limit_type: hard, limit_item: nproc,  value: "16384" }
