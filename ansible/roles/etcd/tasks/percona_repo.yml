---
# percona_repo.yml — subscribe the host to Percona's repositories and enable the PDPG
# (ppg-<major>) repo that ships etcd/Patroni. Idempotent.
#
# NOTE: this is the same `percona-release` setup the future pg_repos role will need.
# It lives here for now so the etcd role is self-contained; factor it into a shared
# role/task when pg_repos lands.

- name: "[etcd] check whether percona-release is installed"
  ansible.builtin.stat:
    path: /usr/bin/percona-release
  register: percona_release_bin

- name: "[etcd] install percona-release (Debian/Ubuntu)"
  when:
    - ansible_os_family == 'Debian'
    - not percona_release_bin.stat.exists
  block:
    - name: "[etcd] fetch percona-release .deb"
      ansible.builtin.get_url:
        url: "https://repo.percona.com/apt/percona-release_latest.{{ ansible_distribution_release }}_all.deb"
        dest: "/tmp/percona-release_latest_{{ ansible_distribution_release }}.deb"
        mode: "0644"

    - name: "[etcd] install percona-release .deb (resolves deps)"
      ansible.builtin.apt:
        deb: "/tmp/percona-release_latest_{{ ansible_distribution_release }}.deb"
        update_cache: true

- name: "[etcd] install percona-release (RHEL/Rocky)"
  ansible.builtin.dnf:
    name: "https://repo.percona.com/yum/percona-release-latest.noarch.rpm"
    state: present
    disable_gpg_check: true
  when:
    - ansible_os_family == 'RedHat'
    - not percona_release_bin.stat.exists

- name: "[etcd] enable EPEL (RHEL/Rocky — etcd/Patroni deps)"
  ansible.builtin.dnf:
    name: epel-release
    state: present
  when:
    - ansible_os_family == 'RedHat'
    - etcd_enable_epel | bool

- name: "[etcd] show enabled Percona repositories"
  ansible.builtin.command: percona-release show
  register: percona_release_show
  changed_when: false

# `percona-release setup` disables other Percona repos and enables only this one, then
# refreshes the package DB. Guarded so we don't re-run (and churn the cache) every time.
- name: "[etcd] enable the Percona PDPG repository ({{ etcd_percona_repo }})"
  ansible.builtin.command: "percona-release setup -y {{ etcd_percona_repo }}"
  register: percona_release_setup
  changed_when: true
  when: etcd_percona_repo not in percona_release_show.stdout
