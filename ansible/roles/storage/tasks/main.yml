---
# storage — format and mount the Terraform-attached data disk at
# {{ postgres_mount_point }}.
# Skips gracefully when data_disk_device is absent (etcd-only nodes that
# carry no data disk in the Terraform inventory).

- name: "[storage] skip hosts with no attached data disk"
  ansible.builtin.meta: end_host
  when: data_disk_device is not defined or not data_disk_device

- name: "[storage] create {{ postgres_data_disk_fs }} filesystem on data disk"
  community.general.filesystem:
    fstype: "{{ postgres_data_disk_fs }}"
    dev: "{{ data_disk_device }}"

- name: "[storage] ensure mount point exists"
  ansible.builtin.file:
    path: "{{ postgres_mount_point }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "[storage] mount data disk and persist to fstab"
  ansible.posix.mount:
    path: "{{ postgres_mount_point }}"
    src: "{{ data_disk_device }}"
    fstype: "{{ postgres_data_disk_fs }}"
    opts: defaults,noatime
    state: mounted
